[workspace]
resolver = "3"
members = [
    "crates/epub-core",
    "crates/storage-core",
    "crates/reader-model",
    "crates/library-core",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
epub-core = { path = "crates/epub-core" }
storage-core = { path = "crates/storage-core" }
reader-model = { path = "crates/reader-model" }
library-core = { path = "crates/library-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
rbook = { version = "=0.7.13", default-features = false, features = ["threadsafe"] }
quick-xml = "0.42"
lol_html = "3"
sha2 = "0.10"
rusqlite = { version = "0.42", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
icu_collator = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
